<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>story</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- markdown変換ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: "Noto Serif JP", serif;
    }

    #content {
      /* コンテンツ全体のコンテナ */
    }

    .page {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 2;
      font-size: 1rem;
      padding: 2rem;
      height: 100vh;
      height: 100svh; /* スマホのアドレスバー対応 */
      width: 100%;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always; /* 必ず1ページずつ止まる */
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .page-inner {
      height: 100%;
      width: max-content;
      flex: none;
      overflow-wrap: anywhere;
    }

    .page-inner > :first-child { margin-block-start: 0; }
    .page-inner > :last-child { margin-block-end: 0; }
    .page-inner img { max-height: 100%; max-width: var(--page-width); object-fit: contain; }
    .page-inner pre { white-space: pre-wrap; }
    .page.is-oversized { overflow: auto; }
    .page.measure { position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none; }
    @media (max-width: 767px) {
      .page { padding: 2rem 1.5rem 3rem; }
    }

    h1 {
      font-size: 1.2rem;
      margin-left: 2rem;
      margin-top: 0;
    }

    p {
      margin: 0 0 1.5rem 0;
    }

    a.back {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      font-size: 0.8rem;
      text-decoration: none;
      color: #777;
      z-index: 100;
      background: rgba(255,255,255,0.8);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
    }

    /* ページインジケーター（任意） */
    .page-indicator {
      position: fixed;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 100;
    }

    .page-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      transition: background 0.3s;
    }

    .page-indicator span.active {
      background: #333;
    }
  </style>
</head>
<body>

<a class="back" href="../">一覧へ</a>

<div id="content"></div>
<div class="page-indicator" id="indicator"></div>

<script>
  const params = new URLSearchParams(location.search);
  const file = params.get("file");
  const content = document.getElementById("content");
  const indicator = document.getElementById("indicator");

  // 縦書きの「1行」は縦1列。本文の行幅を基準に、見出し・余白も含めて実測します。
  const LINES_PER_PAGE = { mobile: 8, desktop: 20 };
  const MOBILE_BREAKPOINT = 767;
  let sourceHTML = "";
  let resizeTimer;

  function splitIntoPages(html) {
    const temp = document.createElement("div");
    temp.innerHTML = html;
    const probe = document.createElement("div");
    probe.className = "page measure";
    probe.setAttribute("aria-hidden", "true");
    const inner = document.createElement("div");
    inner.className = "page-inner";
    probe.append(inner);
    document.body.append(probe);
    const style = getComputedStyle(probe);
    const available = probe.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const lineWidth = parseFloat(style.lineHeight);
    const requested = innerWidth <= MOBILE_BREAKPOINT ? LINES_PER_PAGE.mobile : LINES_PER_PAGE.desktop;
    const lines = Math.max(1, Math.min(requested, Math.floor(available / lineWidth)));
    const budget = Math.min(available, lines * lineWidth);
    document.documentElement.style.setProperty("--page-width", `${budget}px`);
    const pages = [];
    const fits = () => Math.max(inner.getBoundingClientRect().width, inner.scrollWidth) <= budget + 0.5
      && inner.scrollHeight <= inner.clientHeight + 1;
    const flush = (oversized = false) => {
      if (!inner.hasChildNodes()) return;
      pages.push({ html: inner.innerHTML, oversized });
      inner.replaceChildren();
    };
    const segmenter = typeof Intl.Segmenter === "function" ? new Intl.Segmenter("ja", { granularity: "grapheme" }) : null;

    // DOM Rangeで装飾を残したまま分割。文字数は上限判定には使いません。
    function boundaries(node) {
      const points = [];
      function walk(parent) {
        Array.from(parent.childNodes).forEach((child, index) => {
          if (child.nodeType === Node.TEXT_NODE) {
            let offset = 0;
            const segments = segmenter ? Array.from(segmenter.segment(child.data), x => x.segment) : Array.from(child.data);
            for (const segment of segments) {
              offset += segment.length;
              points.push([child, offset]);
            }
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            if (child.matches("br, img, hr, ruby") || !child.hasChildNodes()) points.push([parent, index + 1]);
            else walk(child);
          }
        });
      }
      walk(node);
      return points;
    }

    try {
      for (const original of Array.from(temp.childNodes)) {
        if (original.nodeType === Node.TEXT_NODE && !original.textContent.trim()) continue;
        let remaining = original.cloneNode(true);
        if (remaining.nodeType === Node.TEXT_NODE) {
          const paragraph = document.createElement("p");
          paragraph.append(remaining);
          remaining = paragraph;
        }
        if (remaining.nodeType !== Node.ELEMENT_NODE) continue;
        while (remaining) {
          inner.append(remaining);
          if (fits()) break;
          remaining.remove();
          const points = boundaries(remaining);
          function prefix(count) {
            const range = document.createRange();
            range.setStart(remaining, 0);
            range.setEnd(...points[count - 1]);
            const part = remaining.cloneNode(false);
            part.append(range.cloneContents());
            return part;
          }
          let low = 0, high = points.length;
          while (low < high) {
            const mid = Math.ceil((low + high) / 2);
            const part = prefix(mid);
            inner.append(part);
            const ok = fits();
            part.remove();
            if (ok) low = mid;
            else high = mid - 1;
          }
          if (!low) {
            if (inner.hasChildNodes()) { flush(); continue; }
            // 分割不能な要素はスクロール可能にして、隠さず表示します。
            inner.append(remaining);
            flush(true);
            break;
          }
          inner.append(prefix(low));
          const tailRange = document.createRange();
          tailRange.setStart(...points[low - 1]);
          tailRange.setEnd(remaining, remaining.childNodes.length);
          const tail = remaining.cloneNode(false);
          tail.append(tailRange.cloneContents());
          flush();
          remaining = low === points.length ? null : tail;
        }
      }
      flush();
      return pages;
    } finally { probe.remove(); }
  }

  function renderPages() {
    const oldPages = Array.from(content.querySelectorAll(".page"));
    const oldIndex = Math.max(0, oldPages.findIndex(page => page.getBoundingClientRect().bottom > 1));
    const progress = oldPages.length ? oldIndex / oldPages.length : 0;
    const pages = splitIntoPages(sourceHTML);
    content.innerHTML = pages.map((page, i) => `
      <div class="page${page.oversized ? " is-oversized" : ""}" data-page="${i + 1}">
        <div class="page-inner">${page.html}</div>
      </div>`).join("");
    createPageIndicator(pages.length);
    const target = content.children[Math.min(pages.length - 1, Math.floor(progress * pages.length))];
    if (target) window.scrollTo({ top: target.offsetTop, behavior: "instant" });
    updateIndicator();
  }

  function createPageIndicator(pageCount) {
    indicator.innerHTML = "";
    for (let i = 0; i < pageCount; i++) {
      const dot = document.createElement("span");
      if (i === 0) dot.classList.add("active");
      indicator.appendChild(dot);
    }
  }

  function updateIndicator() {
    const pages = document.querySelectorAll(".page");
    const currentPage = Array.from(pages).reduce((best, page, index) =>
      Math.abs(page.getBoundingClientRect().top) < Math.abs(pages[best].getBoundingClientRect().top) ? index : best, 0);

    document.querySelectorAll(".page-indicator span").forEach((dot, i) => {
      dot.classList.toggle("active", i === currentPage);
    });
  }

  if (!file) {
    content.innerHTML = `
      <div class="page">
        <div class="page-inner">
          <h1>読み込みエラー</h1>
          <p>URLに <code>?file=xxxx.md</code> が付いていません。</p>
          <p>一覧ページから開いてください。</p>
        </div>
      </div>
    `;
  } else {
    fetch(`./${file}`)
      .then(res => {
        if (!res.ok) throw new Error(`Cannot load: ${file}`);
        return res.text();
      })
      .then(async md => {
        sourceHTML = marked.parse(md);
        if (document.fonts) await document.fonts.ready;
        renderPages();
        window.addEventListener("scroll", updateIndicator, { passive: true });
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(renderPages, 180);
        });
        if (document.fonts) document.fonts.addEventListener("loadingdone", renderPages);

        // タイトルをHTML titleにも反映
        const h1 = content.querySelector("h1");
        if (h1) document.title = h1.textContent;
      })
      .catch(err => {
        content.innerHTML = `
          <div class="page">
            <div class="page-inner">
              <h1>読み込み失敗</h1>
              <p>${String(err)}</p>
              <p>ファイル名と場所（stories/内）を確認してください。</p>
            </div>
          </div>
        `;
      });
  }
</script>

</body>
</html>
