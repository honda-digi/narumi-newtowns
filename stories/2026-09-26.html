<html lang="ja">
<head>

<title>うみの みえる おか ｜ 鳴海ニュータウン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e1d6; --ink:#3b352f; --sub:#7b7266;
  --case:#2e2c31; --case-edge:#18171b; --case-hi:#48454d;
  --btn:#3e3b42; --btn-ink:#f1ece2; --btn-on:#b8322f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131215; --ink:#d9d3c7; --sub:#8b8377;
    --case:#211f24; --case-edge:#0a0a0c; --case-hi:#333037;
    --btn:#2f2c33; --btn-ink:#ece6da; --btn-on:#b8322f;
  }
}
:root[data-theme="dark"]{
  --bg:#131215; --ink:#d9d3c7; --sub:#8b8377;
  --case:#211f24; --case-edge:#0a0a0c; --case-hi:#333037;
  --btn:#2f2c33; --btn-ink:#ece6da; --btn-on:#b8322f;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.wrap{width:100%;max-width:940px;max-width:min(940px,calc((100svh - 150px) * 1.0667));min-width:280px;padding:18px 12px 20px}
.case{
  background:var(--case);border-radius:18px;padding:clamp(10px,2.4vw,22px);
  box-shadow:inset 0 1px 0 var(--case-hi),0 0 0 1px var(--case-edge),0 12px 28px rgba(0,0,0,.28);
}
.screen{
  position:relative;width:100%;aspect-ratio:256/240;background:#000;
  container-type:inline-size;overflow:hidden;border-radius:4px;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;outline:none;
}
.screen:focus-visible{box-shadow:0 0 0 3px #f8d878}
#scene{
  position:absolute;left:0;top:0;width:100%;height:73.3334%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.scan{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(100% / 240 * .62),rgba(0,0,0,.10) calc(100% / 240 * .62),rgba(0,0,0,.10) calc(100% / 240));
}
.msgarea{position:absolute;left:0;right:0;bottom:0;height:26.6667%;padding:1.3cqw 2.6cqw 2.2cqw;display:flex}
.msg{
  flex:1;position:relative;background:#000;color:#fcfcfc;
  border:.75cqw solid #fcfcfc;border-radius:1.6cqw;
  font-size:min(3.05vw,28px);font-size:3.05cqw;line-height:1.74;letter-spacing:.04em;
  padding:1.4cqw 2.8cqw 1cqw;overflow:hidden;
}
.msg.hide{visibility:hidden}
#txt .c{visibility:hidden}
#txt .c.on{visibility:visible}
#txt small{font-size:.78em;color:#bcbcbc}
.cur{position:absolute;right:2.2cqw;bottom:.9cqw;font-size:2.4cqw;line-height:1;display:none;animation:blink .9s steps(1) infinite}
.cur.show{display:block}
.prompt{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.overlay{position:absolute;left:0;right:0;top:0;height:73.3334%;pointer-events:none;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fcfcfc}
.title{padding-top:3.6cqw;transition:opacity .7s steps(4)}
.title h1{margin:0;font-weight:400;font-size:7.4cqw;letter-spacing:.16em;color:#fce0a8;text-shadow:.55cqw .55cqw 0 #881400,-.22cqw 0 0 #881400,0 -.22cqw 0 #881400}
.title p{margin:1.8cqw 0 0;font-size:2.8cqw;letter-spacing:.14em;text-shadow:.35cqw .35cqw 0 #4428bc,-.18cqw 0 0 #4428bc,0 -.18cqw 0 #4428bc}
.title.gone{opacity:0}
.end{justify-content:flex-start;padding-top:13cqw;opacity:0;transition:opacity 1.4s steps(5)}
.end.show{opacity:1}
.end span{font-size:6.2cqw;letter-spacing:.34em;text-shadow:.45cqw .45cqw 0 #0000bc}
@container (max-width:520px){
  .msg{font-size:3.6cqw;line-height:1.56;padding:1.2cqw 2.4cqw .8cqw}
  .title h1{font-size:8.2cqw}
  .title p{font-size:3.3cqw}
}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:clamp(12px,2vw,18px)}
.btn{
  font:inherit;font-size:14px;letter-spacing:.08em;color:var(--btn-ink);background:var(--btn);
  border:0;border-radius:999px;padding:9px 18px 8px;min-width:96px;cursor:pointer;
  box-shadow:0 3px 0 var(--case-edge);
}
.btn[aria-pressed="true"]{background:var(--btn-on)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--case-edge)}
.btn:focus-visible{outline:2px solid #f8d878;outline-offset:2px}
.hint{margin:14px 0 0;text-align:center;font-size:12px;color:var(--sub);letter-spacing:.06em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.prompt,.cur{animation:none}}
</style>
</head>

<div class="wrap">
  <div class="case">
    <div class="screen" id="screen" tabindex="0" role="button" aria-label="物語をすすめる">
      <canvas id="scene" width="256" height="176"></canvas>
      <div class="overlay title" id="title">
        <h1>うみの みえる おか</h1>
      </div>
      <div class="overlay end" id="end"><span>おわり</span></div>
      <div class="msgarea"><div class="msg" id="msg"><div id="txt"></div><div class="cur" id="cur">▼</div></div></div>
      <div class="scan"></div>
    </div>
    <div class="controls">
      <button class="btn" id="bAuto" type="button" aria-pressed="false">オート</button>
      <button class="btn" id="bSnd" type="button" aria-pressed="true">おと：あり</button>
      <button class="btn" id="bReset" type="button">はじめから</button>
    </div>
  </div>
  <p class="hint">クリック・タップ・スペースキーで すすむ</p>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

 {t:.04,text:"小学生のころから数えきれないくらい座ってきたそのベンチに、今日はひさしぶりに、ムギを連れて腰をおろしている。"},
 {t:.07,text:"夕方の海は、沖のほうから少しずつ橙色になっていって、ずっと遠くを、小さな船がゆっくり横切っていくのが見えた。"},
 {t:.10,text:"九月も終わりに近づいて、丘の上を吹く風はずいぶんひんやりとしてきていて、半袖から出た腕のあたりがすうすうする。"},
 {t:.12,text:"足もとのエノコログサは、穂の先のほうから茶色くなりかけていて、風がくるたびに、かさかさと乾いた音をたてて揺れている。"},
 {t:.15,text:"草むらのあちこちから虫の声がしていて、耳をすますと、いくつもの声が重なりあって、丘ぜんたいがしずかに鳴っているように聞こえた。"},
 {t:.17,text:"夏休みのあいだも会社選びや面接の練習で手いっぱいで、ムギの散歩は、いつのまにか母の役目になっていた。"},
 {t:.19,text:"受けた会社から内定の通知が届いたのはおとといのことで、来年の春には高校を出て、この町を離れ、県外の工場の寮に入ることになっている。"},
 {t:.20,text:"夕方、リードを手に玄関を出ようとしたら、台所にいた母が「お母さんも行こうかな」と言って、サンダルをつっかけてついてきた。"},
 {t:.21,text:"団地のあいだの坂道をのぼりながら、母は、ムギがうちに来た日のことを話しはじめた。"},
 {t:.22,mom:1,text:"「あんた、段ボールの中のムギを見て、泣いたんだよ。ちっちゃすぎるって言って」"},
 {t:.23,text:"そんなことはおぼえていないと言うと、母は「泣いた泣いた」と、なんだかうれしそうに何度もくりかえした。"},
 {t:.24,text:"それからは、思い出したことを順番に出しあうみたいにして、ふたりで昔の話ばかりした。"},
 {t:.25,text:"ムギが脱走して、商店街の魚屋さんの前で、アジの頭をもらってちょこんと座っていた日のことや、団地の駐車場で自転車の練習をした夏のこと。"},
 {t:.26,mom:1,text:"「うしろを持っててって言うから、息を切らしてずっと走ってたら、いつのまにかひとりで乗ってたのよ」と母は笑った。"},
 {t:.27,text:"坂の途中で何度も立ちどまって笑って、公園の入り口に着くころには、ふたりとも少し息が上がっていた。"},
 {t:.29,text:"母は「晩ごはんの支度があるから」と、手をふって先に坂をおりていった。"},
 {t:.31,text:"ひとりになると、さっきまでの笑い声が、まだ耳のおくのほうにのこっているような気がした。"},
 {t:.33,ev:'dogLook',text:"ムギがこちらを見あげて、しっぽを二回だけふった。口のまわりの毛が、いつのまにかずいぶん白くなっている。"},
 {t:.47,ev:'sea',text:"目の前の海に、夕日が少しずつしずんでいって、最後のひとかけらが水平線のむこうに消えるまで、じっと見ていた。"},
 {t:.50,text:"春からは、この景色を毎日のように見ることもなくなるんだと思うと、胸のあたりがきゅっとなった。"},
 {t:.53,text:"さびしいのかと自分にきいてみると、たぶん少しだけさびしくて、それでも、町を出ると決めたことは、まちがっていないと思えた。"},
 {t:.57,ev:'windows',text:"向こうの丘の団地の窓に、ひとつ、またひとつと明かりがともりはじめる。"},
 {t:.61,text:"あのなかのどれかひとつがうちの台所で、今ごろ母は、鍋に火をかけながら、ムギのごはんも用意しているのかもしれない。"},
 {t:.66,ev:'lamp',text:"公園の外灯がぱちぱちとまたたいて、ベンチのまわりだけが、ぼんやりと白く明るくなった。"},
 {t:.70,text:"暗くなるにつれて、虫の声はさっきよりも大きく、近くなってくる。"},
 {t:.75,ev:'star',text:"夕日のしずんだあたりの空に、星がひとつだけ出ていた。"},
 {t:.79,ev:'still',text:"来年の今ごろは、どこで、どんな夕方をすごしているんだろう。"},
 {t:.83,ev:'pet',text:"ムギの背中をなでると、風で冷えた手のひらに、じんわりとあたたかさがつたわってくる。"},
 {t:.87,ev:'dogStand',text:"「帰ろうか」と声をかけると、ムギはもう立ちあがって、坂の下のほうを見ていた。"},
 {t:.91,ev:'personStand',text:"春までに、あと何回ここに来られるだろう。そんなことを考えながら、明かりのついた団地のほうへ、ゆっくりと坂をおりていった。"}

function buildSky(s){
  const c=mk(W,HOR),g=c.getContext('2d'),b=PAL[s].sky;let y=0;
  for(let i=0;i<8;i++){g.fillStyle=b[i];g.fillRect(0,y,W,BANDS[i]);y+=BANDS[i];}
  y=0;
  for(let i=0;i<7;i++){
    y+=BANDS[i];
    g.fillStyle=b[i+1];
    for(let x=0;x<W;x++){if(((x+y)&1)===0)g.fillRect(x,y-1,1,1);if((x&3)===((y&1)<<1))g.fillRect(x,y-2,1,1);}
    g.fillStyle=b[i];
    for(let x=0;x<W;x++){if(((x+y)&3)===1)g.fillRect(x,y,1,1);}
  }

}

    if((x&1)===0)f(x,HOR+5,1,1,p.sea[1]);

    if((x&1)===1)f(x,HOR+17,1,1,p.sea[2]);

}

function drawGlitter(p){
  const sy=sunY();
  if(sy+9>=HOR&&sy-9<HOR){ // だるま夕日
    const w0=Math.floor(Math.sqrt(Math.max(0,81-(HOR-sy)*(HOR-sy))));
    for(let k=0;k<3;k++){const ww=Math.max(1,w0-k*3);rect(SUNX-ww,HOR+k,ww*2+1,1,p.sun[1]);}
  }

    const I=vis?1:Math.max(0,1-(tod-0.46)/0.14)*0.55;
    if(I>0.02){
      for(let y=HOR+1;y<114;y++){
        const hw=1+(y-HOR)*0.42;
        if(rr()<0.25+0.55*I){const n=1+(rr()*(1+2*I)|0);for(let k=0;k<n;k++){const l=1+(rr()*(1+3*I)|0);glit.push(Math.round(SUNX+(rr()*2-1)*hw-l/2),y,l,0);}}

}
function drawPetArm(pp){
  if(!petting||!showPerson)return;
  const ex=155+Math.round(Math.sin(T*3)),ey=128;
  linePix(137,123,ex,ey-1,K,149);linePix(137,125,ex,ey+1,K,149);linePix(137,124,ex,ey,pp.N,149);
}
function drawPetHand(pp){
  if(!petting||!showPerson)return;
  const ex=155+Math.round(Math.sin(T*3));
  rect(ex,126,4,4,K);rect(ex,127,3,2,pp.N);
}
function drawDog(pd){
  if(!showDog)return;
  const y=dogTop();
  let wag=0;
  if(T>wagStart&&T<wagUntil)wag=Math.sin(T*18)>0?1:-1;
  else if(dogStanding)wag=Math.sin(T*10)>0?1:0;
  else if(Math.sin(T*0.7+1)>0.97)wag=Math.sin(T*14)>0?1:0;
  const sniff=(!dogLook&&!dogStanding&&(T%9)<0.6)?1:0;
  const hdx=dogLook?-1:(dogStanding?1:0);
  if(dogStanding){
    drawSprite(DOG_ST,DX,y+6,pd,6,15);
    drawSprite(TAIL,DX+4+wag,y+7,pd);
    drawSprite(DOG_ST,DX+hdx,y,pd,0,6);
  }else{
    drawSprite(DOG_SIT,DX,y+7,pd,7,15);
    drawSprite(TAIL,DX+4+wag,y+10,pd);
    drawSprite(DOG_SIT,DX+hdx,y+sniff,pd,0,7);
  }
}
function drawStalks(p){
  const wind=gust;
  for(const s of STALKS){
    const sway=Math.sin(T*1.6+s.ph)*(0.5+wind)*s.h*0.035*s.flex+wind*s.h*0.06*s.flex;
    const x0=s.x,y0=s.base,tx=x0+s.lean*s.h+sway,ty=y0-s.h,cx=x0+s.lean*s.h*0.3+sway*0.25,cy=y0-s.h*0.55;
    const col=s.green?p.dry.green:(s.dark?p.dry.dark:p.dry.stem);
    ctx.fillStyle=col;
    const n=Math.max(4,s.h|0);
    for(let i=0;i<=n;i++){const u=i/n,a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;ctx.fillRect(Math.round(a*x0+b*cx+c*tx),Math.round(a*y0+b*cy+c*ty),1,1);}
    const X=Math.round(tx),Y=Math.round(ty);
    if(s.type==='eno'){
      ctx.fillStyle=s.green?p.dry.green:p.dry.tip;
      const d=(s.lean+sway*0.05)>=0?1:-1;
      for(let k=0;k<5;k++){const xx=X+Math.round(d*k*0.7),yy=Y+Math.round(k*0.6);ctx.fillRect(xx,yy,1,1);if(k>0&&k<4)ctx.fillRect(xx,yy-1,1,1);}
    }else if(s.type==='susu'){
      ctx.fillStyle=p.dry.tip;
      for(let j=0;j<4;j++)for(let k=0;k<6;k++)ctx.fillRect(Math.round(X+(j-1.5)*0.9+k*(0.35+wind*0.5)),Y+k+(j&1),1,1);
    }else{
      for(const lf of s.leaves){
        const u=lf.u,a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;
        const lx=Math.round(a*x0+b*cx+c*tx),ly=Math.round(a*y0+b*cy+c*ty);
        for(let k=1;k<=lf.l;k++)ctx.fillRect(lx+lf.d*k+(k>2?Math.round(sway*0.3):0),ly+(k>>1)+(k>2?1:0),1,1);
      }
    }
  }
}
function updFlies(dt){
  for(const f of FLIES){
    if(tod>0.46){f.w=0;f.tx=f.x<128?-30:290;f.ty=f.y-30;}
    if(f.w>0){f.w-=dt;f.x+=Math.sin(T*9+f.y)*0.08;if(f.w<=0)newTarget(f);continue;}
    const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy);
    if(d<1.5){f.w=0.6+rr()*2.2;continue;}
    const sp=Math.min(d*3,38);f.x+=dx/d*sp*dt;f.y+=dy/d*sp*dt;if(Math.abs(dx)>0.5)f.dir=dx>=0?1:-1;
  }
}
function drawFlies(p){
  const wf=(T*20|0)&1;
  for(const f of FLIES){
    const x=Math.round(f.x),y=Math.round(f.y),d=f.dir;
    if(x<-8||x>W+8)continue;
    for(let k=0;k<6;k++)rect(x-d*k,y,1,1,k===0?p.fly.head:p.fly.body);
    const w=p.fly.wing;
    if(wf){rect(x-d,y-1,1,1,w);rect(x-d*2,y-1,1,1,w);rect(x-d,y+1,1,1,w);rect(x-d*2,y+1,1,1,w);}
    else{rect(x-d,y-2,1,1,w);rect(x-d*2,y-1,1,1,w);rect(x-d,y+2,1,1,w);rect(x-d*2,y+1,1,1,w);}
  }
}
function drawFade(){
  if(fade<=0)return;
  const q=Math.round(fade*4)/4;if(q<=0)return;
  ctx.fillStyle='rgba(0,0,0,'+q+')';ctx.fillRect(0,0,W,H);
}

/* ================= 描画 ================= */
function render(){
  const p=PAL[stage],on=lampLevel(),lit=on>0;
  ctx.drawImage(cSky[stage],0,0);
  drawStars();drawSun(p);drawClouds(p);
  ctx.drawImage(cSea[stage],0,0);
  drawGlitter(p);drawShip(p);drawLighthouse();
  ctx.drawImage(cFront[stage],0,0);
  drawWindows();
  drawLampPatch(on);drawLamp(p,on);
  const pp=lit?LIT.per:p.per,pd=lit?LIT.dog:p.dog;
  drawPerson(pp);
  drawBench(lit?LIT.wood:p.wood,lit?LIT.metal:p.metal,lit?LIT.grass.lo:p.grass.lo);
  drawPetArm(pp);
  drawLeash(lit?LIT.leash:p.leash);
  drawDog(pd);
  drawPetHand(pp);
  drawStalks(p);
  drawFlies(p);
  drawHalo(on);
  drawFade();
}

/* ================= 音 ================= */
let AC=null,master=null,windG,windF,waveG,bugBus,soundOn=true,audT=0;
const VOICES=[{k:'suzu',pan:-.55,at:0},{k:'enma',pan:.25,at:0},{k:'tsuzu',pan:-.2,at:0},{k:'suzu',pan:.5,at:.2},{k:'aoma',pan:.7,at:.5},{k:'enma',pan:-.75,at:.6},{k:'suzu',pan:.05,at:.7}];
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AC=new C();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=soundOn?0.9:0;master.connect(AC.destination);
  const len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=0.99765*b0+w*0.0990460;b1=0.96300*b1+w*0.2965164;b2=0.57000*b2+w*1.0526913;d[i]=(b0+b1+b2+w*0.1848)*0.22;}
  const n1=AC.createBufferSource();n1.buffer=buf;n1.loop=true;
  windF=AC.createBiquadFilter();windF.type='bandpass';windF.frequency.value=500;windF.Q.value=0.8;
  windG=AC.createGain();windG.gain.value=0;
  n1.connect(windF);windF.connect(windG);windG.connect(master);n1.start();
  const n2=AC.createBufferSource();n2.buffer=buf;n2.loop=true;n2.playbackRate.value=0.7;
  const wf=AC.createBiquadFilter();wf.type='lowpass';wf.frequency.value=380;
  waveG=AC.createGain();waveG.gain.value=0;
  n2.connect(wf);wf.connect(waveG);waveG.connect(master);n2.start(AC.currentTime+0.7);
  bugBus=AC.createGain();bugBus.gain.value=0;bugBus.connect(master);
  const now=AC.currentTime;VOICES.forEach((v,i)=>v.n=now+0.8+i*0.9);
}
function tone(freq,t0,dur,vol,pan,am){
  const o=AC.createOscillator();o.type='sine';o.frequency.value=freq;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.008);g.gain.setValueAtTime(vol,t0+Math.max(0.009,dur-0.02));g.gain.linearRampToValueAtTime(0,t0+dur);
  let node=o;
  if(am){const a=AC.createGain();a.gain.value=0.5;const l=AC.createOscillator();l.frequency.value=am;const lg=AC.createGain();lg.gain.value=0.5;l.connect(lg);lg.connect(a.gain);o.connect(a);node=a;l.start(t0);l.stop(t0+dur+0.05);}
  node.connect(g);
  if(AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=pan;g.connect(pn);pn.connect(bugBus);}else g.connect(bugBus);
  o.start(t0);o.stop(t0+dur+0.05);
}
function chirp(v,t0){
  switch(v.k){
    case 'suzu':{const f=4250+Math.random()*250,d=0.32+Math.random()*0.22;tone(f,t0,d,0.045,v.pan,34+Math.random()*6);return t0+d+0.55+Math.random();}
    case 'enma':{const f=3900+Math.random()*200;let tt=t0;const n=3+(Math.random()*3|0);for(let i=0;i<n;i++){tone(f,tt,0.045,0.04,v.pan,0);tt+=0.075;}tone(f*1.02,tt+0.03,0.26,0.04,v.pan,22);return tt+2.3+Math.random()*2.5;}
    case 'tsuzu':{const f=4600+Math.random()*150;let tt=t0;const n=6+(Math.random()*10|0);for(let i=0;i<n;i++){tone(f,tt,0.03,0.018,v.pan,0);tt+=0.11;}return tt+0.6+Math.random()*1.4;}
    default:{const f=3100+Math.random()*100;let tt=t0;const n=4+(Math.random()*5|0);for(let i=0;i<n;i++){tone(f,tt,0.11,0.02,v.pan,48);tt+=0.3;}return tt+1.2+Math.random()*2;}
  }
}
function updAudio(){
  if(!AC||state==='title')return;
  const now=AC.currentTime;
  if(T-audT>0.12){
    audT=T;
    windG.gain.setTargetAtTime(0.05+0.17*gust*gust,now,0.35);
    windF.frequency.setTargetAtTime(320+520*gust,now,0.5);
    waveG.gain.setTargetAtTime(0.035+0.025*Math.sin(T*0.78),now,0.6);
    bugBus.gain.setTargetAtTime(0.28+0.62*tod,now,1.2);
  }
  for(const v of VOICES){
    if(tod<v.at){v.n=Math.max(v.n,now+0.5);continue;}
    if(v.n<now)v.n=now+Math.random()*1.2;
    let guard=0;while(v.n<now+0.3&&guard++<4)v.n=chirp(v,v.n);
  }
}
function blip(mom){
  if(!AC||!soundOn)return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.value=(mom?523:698)*(1+(Math.random()-0.5)*0.02);
  g.gain.setValueAtTime(0.022,t0);g.gain.exponentialRampToValueAtTime(0.0008,t0+0.05);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.06);
}
function jingle(){
  if(!AC)return;
  const t0=AC.currentTime+0.1;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  const mg=AC.createGain();mg.gain.value=0.05;lp.connect(mg);mg.connect(master);
  let tt=t0;
  for(const [f,d] of [[659,.32],[587,.32],[523,.32],[392,.64],[440,.32],[523,.32],[587,.32],[523,1.3]]){
    const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(1,tt+0.01);g.gain.exponentialRampToValueAtTime(0.25,tt+d*0.6);g.gain.linearRampToValueAtTime(0.0001,tt+d-0.01);
    o.connect(g);g.connect(lp);o.start(tt);o.stop(tt+d);tt+=d;
  }
  tt=t0;
  for(const [f,d] of [[131,1.6],[110,.64],[98,.32],[131,1.3]]){
    const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(0.12,tt+0.02);g.gain.linearRampToValueAtTime(0.0001,tt+d-0.02);
    o.connect(g);g.connect(master);o.start(tt);o.stop(tt+d);tt+=d;
  }
}

/* ================= 進行 ================= */
function fire(ev){
  switch(ev){
    case 'dogLook':dogLook=true;headDx=1;wagStart=T+0.8;wagUntil=T+1.5;break;
    case 'sea':dogLook=false;headDx=0;break;
    case 'windows':winOn=true;winT0=T;break;
    case 'lamp':lampOn=true;lampT0=T+0.5;break;
    case 'star':starOn=true;starT0=T+0.7;headDy=-1;break;
    case 'still':headDy=0;break;
    case 'pet':headDy=0;headDx=1;petting=true;break;
    case 'dogStand':petting=false;headDx=1;dogStanding=true;break;
    case 'personStand':headDx=0;personStanding=true;break;
  }
}
function showPage(i){
  page=i;const pg=PAGES[i];
  todT=Math.max(todT,pg.t);
  if(pg.ev)fire(pg.ev);
  txt.textContent='';spans=[];chars=[...pg.text];
  const frag=document.createDocumentFragment();
  for(const ch of chars){const s=document.createElement('span');s.className='c';s.textContent=ch;frag.appendChild(s);spans.push(s);}
  txt.appendChild(frag);
  ti=0;typing=true;tNext=T+0.3;cur.classList.remove('show');
  live.textContent=pg.text;
}
function finishPage(){typing=false;cur.classList.add('show');autoAt=T+1.8+spans.length*0.05;}
function updStory(){
  if(state!=='story')return;
  if(typing){
    let guard=0;
    while(typing&&T>=tNext&&guard++<8){
      const ch=chars[ti];spans[ti].classList.add('on');ti++;
      if(!'、。「」…！？　 '.includes(ch)&&(ti&1))blip(PAGES[page].mom);
      let d=0.048;
      if(ch==='、')d+=0.13;else if('。！？'.includes(ch))d+=0.28;else if(ch==='」')d+=0.12;
      tNext+=d;
      if(ti>=spans.length)finishPage();
    }
  }else if(autoOn&&T>=autoAt)advance();
}
function setPrompt(label,sub){
  txt.innerHTML='<span class="prompt">▶ '+label+'</span>'+(sub?'<br><small>'+sub+'</small>':'');
  cur.classList.remove('show');
}
function startStory(){
  state='story';titleEl.classList.add('gone');msg.classList.remove('hide');showPage(0);
}
function startEnding(){
  state='ending';msg.classList.add('hide');cur.classList.remove('show');todT=0.96;seq={t0:T,ph:0};live.textContent='';
}
function updSeq(dt){
  if(fadeIn>0){fadeIn=Math.max(0,fadeIn-dt);fade=fadeIn;}
  if(!seq)return;
  const e=T-seq.t0;
  if(e<1.4)fade=e/1.4;
  else if(e<2.4){fade=1;showPerson=false;showDog=false;}
  else if(e<4.4)fade=1-(e-2.4)/2;
  else{
    fade=0;
    if(e>7.5&&seq.ph===0){seq.ph=1;endEl.classList.add('show');jingle();live.textContent='おわり';}
    if(e>11&&seq.ph===1){seq.ph=2;state='done';msg.classList.remove('hide');setPrompt('もういちど みる');}
  }
}
function restart(){
  seq=null;fade=1;fadeIn=1;endEl.classList.remove('show');
  resetScene();tod=0;todT=0;
  startStory();
}
function advance(){
  initAudio();
  if(state==='title'){startStory();return;}
  if(state==='story'){
    if(typing){for(let i=ti;i<spans.length;i++)spans[i].classList.add('on');ti=spans.length;finishPage();return;}
    if(page<PAGES.length-1)showPage(page+1);else startEnding();
    return;
  }
  if(state==='done')restart();
}

/* ================= 入力 ================= */
screenEl.addEventListener('click',advance);
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON')return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'){e.preventDefault();if(!e.repeat)advance();}
});
bAuto.addEventListener('click',()=>{autoOn=!autoOn;bAuto.setAttribute('aria-pressed',autoOn);if(autoOn&&state==='story'&&!typing)autoAt=Math.min(autoAt,T+1.2);});
bSnd.addEventListener('click',()=>{
  soundOn=!soundOn;bSnd.setAttribute('aria-pressed',soundOn);bSnd.textContent=soundOn?'おと：あり':'おと：なし';
  if(AC&&master)master.gain.setTargetAtTime(soundOn?0.9:0,AC.currentTime,0.05);
});
bReset.addEventListener('click',()=>{initAudio();if(state==='title')startStory();else restart();});

/* ================= ループ ================= */
function loop(now){
  now/=1000;
  const dt=Math.min(0.05,lastNow?now-lastNow:0.016);lastNow=now;T+=dt;
  const diff=todT-tod;
  if(Math.abs(diff)<0.0008)tod=todT;else tod+=diff*Math.min(1,dt*0.33)+Math.sign(diff)*dt*0.002;
  gust=Math.max(0,Math.min(1.1,0.55+0.25*Math.sin(T*0.23)+0.2*Math.sin(T*0.61+1.3)+0.08*Math.sin(T*1.7)));
  stage=stageOf(tod);
  updFlies(dt);updStory();updSeq(dt);updAudio();
  render();
  requestAnimationFrame(loop);
}
resetScene();
txt.innerHTML='<small>鳴海ニュータウン・九月のおわり</small><br><span class="prompt">▶ はじめる</span><br><small>おとが でます</small>';
requestAnimationFrame(loop);
})();
</script>
